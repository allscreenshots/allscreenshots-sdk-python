[project]
name = "allscreenshots-demo"
version = "1.0.0"
description = "Demo application for the Allscreenshots SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.0",
    "allscreenshots-sdk>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py"]

[tool.uv.sources]
allscreenshots-sdk = { path = "../sdk" }
