name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK dependencies
        working-directory: sdk
        run: uv sync --dev

      - name: Run ruff check
        working-directory: sdk
        run: uv run ruff check .

      - name: Run ruff format check
        working-directory: sdk
        run: uv run ruff format --check .

      - name: Run mypy
        working-directory: sdk
        run: uv run mypy src/

  test-sdk:
    name: Test SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK dependencies
        working-directory: sdk
        run: uv sync --dev

      - name: Run unit tests
        working-directory: sdk
        run: uv run pytest tests/unit -v --cov=src/allscreenshots_sdk --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: sdk/coverage.xml
          fail_ci_if_error: false

  build-sdk:
    name: Build SDK
    runs-on: ubuntu-latest
    needs: [lint, test-sdk]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build SDK
        working-directory: sdk
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: sdk/dist/
          retention-days: 7

  build-sample-app:
    name: Build sample app
    runs-on: ubuntu-latest
    needs: build-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sample app dependencies
        working-directory: sample-app
        run: uv sync

      - name: Check sample app imports
        working-directory: sample-app
        run: uv run python -c "from allscreenshots_sdk import AllScreenshotsClient; print('Import successful')"

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [lint, test-sdk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK dependencies
        working-directory: sdk
        run: uv sync --dev

      - name: Run integration tests
        working-directory: sdk
        env:
          ALLSCREENSHOTS_API_KEY: ${{ secrets.ALLSCREENSHOTS_API_KEY }}
        run: uv run pytest tests/integration -v

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: sdk/test-report.html
          retention-days: 30
